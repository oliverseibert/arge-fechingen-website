<app-page-header
  crumbLabel="Der Vorstand"
  title="Der"
  accent="Vorstand"
  intro="Der Vorstand der ARGE Fechingen stellt sich vor."
/>

<div class="container section">
  <app-todo
    >Inhalte zum Vorstand folgen (Fotos, Namen, Funktionen und Texte in vorstand.data.ts
    eintragen)</app-todo
  >

  <figure class="group">
    @if (gruppenbild.src) {
      <img [src]="gruppenbild.src" [alt]="gruppenbild.alt" width="1200" height="800" />
    } @else {
      <div
        class="photo-placeholder group-placeholder"
        role="img"
        [attr.aria-label]="'Platzhalter: ' + gruppenbild.alt"
      >
        <app-crest-mark class="placeholder-mark" />
        <span>TODO: Gruppenbild</span>
      </div>
    }
    <figcaption>Foto: {{ gruppenbild.credit }}</figcaption>
  </figure>

  <span class="eyebrow">Team</span>
  <h2 class="section-title">Mitglieder</h2>
  <ul class="grid members">
    @for (m of mitglieder; track $index) {
      <li class="card member">
        @if (m.foto) {
          <img
            [src]="m.foto"
            [alt]="'Foto von ' + m.name"
            width="320"
            height="320"
            loading="lazy"
          />
        } @else {
          <div class="photo-placeholder" role="img" aria-label="Platzhalter für Foto">
            <app-crest-mark class="placeholder-mark" />
            <span>TODO: Foto</span>
          </div>
        }
        <span class="badge badge-primary role">{{ m.funktion }}</span>
        <h3>{{ m.name }}</h3>
        <p class="muted">{{ m.text }}</p>
      </li>
    }
  </ul>
</div>
